services:
  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - stream_network
    restart: unless-stopped

  # Alertmanager - Alert Management
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - '9093:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - stream_network
    restart: unless-stopped

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - stream_network
    restart: unless-stopped

  # Kafka Exporter - Kafka Metrics
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    ports:
      - '9308:9308'
    command:
      - '--kafka.server=kafka:29092'
    networks:
      - stream_network
    restart: unless-stopped

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    ports:
      - '8082:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - '--housekeeping_interval=30s'
      - '--max_housekeeping_interval=35s'
      - '--allow_dynamic_housekeeping=true'
    networks:
      - stream_network
    restart: unless-stopped

  # Enhanced Grafana with Provisioning (extends main grafana service)
  grafana-enhanced:
    image: grafana/grafana:latest
    container_name: grafana-enhanced
    ports:
      - '3001:3000'  # Different port to avoid conflict
    volumes:
      - grafana_enhanced_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel,grafana-polystat-panel
      - GF_FEATURE_TOGGLES_ENABLE=ngalert
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    networks:
      - stream_network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Loki for Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - '3100:3100'
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - stream_network
    restart: unless-stopped

  # Promtail for Log Collection
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    ports:
      - '9080:9080'
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - stream_network
    depends_on:
      - loki
    restart: unless-stopped

  # Jaeger for Distributed Tracing (Alternative to Tempo)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - '16686:16686'
      - '14268:14268'
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - stream_network
    restart: unless-stopped

  # Enhanced OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '8888:8888'   # Prometheus metrics
      - '8889:8889'   # Prometheus exporter metrics
      - '13133:13133' # Health check
      - '4317:4317'   # OTLP gRPC receiver
      - '4318:4318'   # OTLP HTTP receiver
      - '9464:9464'   # Prometheus receiver
    depends_on:
      - prometheus
      - tempo-enhanced
      - jaeger
    networks:
      - stream_network
    restart: unless-stopped

  # Tempo for Distributed Tracing (enhanced version)
  tempo-enhanced:
    image: grafana/tempo:latest
    container_name: tempo-enhanced
    command: [ '-config.file=/etc/tempo.yaml' ]
    user: "0:0"  # Run as root to avoid permission issues
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml
      - tempo_enhanced_data:/tmp/tempo
    ports:
      - '3201:3200'   # tempo (different port)
      - '4319:4317'   # otlp grpc (different port)
      - '4320:4318'   # otlp http (different port)
    networks:
      - stream_network
    restart: unless-stopped
    environment:
      - TEMPO_DATA_PATH=/tmp/tempo

  # Uptime Kuma for Service Monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - '3002:3001'  # Different port to avoid conflict
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - stream_network
    restart: unless-stopped

volumes:
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  grafana_enhanced_data:
    driver: local
  loki_data:
    driver: local
  tempo_enhanced_data:
    driver: local
  uptime_kuma_data:
    driver: local

networks:
  stream_network:
    external: true
    name: stream_network