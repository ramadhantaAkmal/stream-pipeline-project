version: "3.9"

networks:
  stream-network:
    external: true
    name: stream-network

volumes:
  clickhouse-data:
  kafka-data:
  grafana-data:
  flink-checkpoints:

services:

# ── 1. KAFKA (KRaft mode) ──────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    hostname: kafka
    networks:
      - stream-network
    ports:
      - "9092:9092"   # external (your host machine)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"  # fixed cluster ID for KRaft
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: always

# ── 2. SCHEMA REGISTRY ───────────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    hostname: schema-registry
    networks:
      - stream-network
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      kafka:
        condition: service_healthy
    restart: always

# ── 3. KAFKA UI (visual dashboard for topics & messages) ─────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - stream-network
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
    restart: always

# ── 4. CLICKHOUSE ─────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    hostname: clickhouse
    networks:
      - stream-network
    ports:
      - "8123:8123"   # HTTP interface (query via browser/curl)
      - "9000:9000"   # Native TCP interface
      - "9004:9004"   # MySQL wire protocol (used by Flink JDBC sinks)
      - "9363:9363"   # Prometheus metrics endpoint
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init-scripts:/docker-entrypoint-initdb.d   # runs SQL on first start
      - ./monitoring/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    environment:
      CLICKHOUSE_DB: pipeline_db
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: always

# ── 5. PRODUCER (Python service that generates & publishes events) ──
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: producer
    networks:
      - stream-network
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: user-events
      EVENTS_PER_SECOND: 5        # tune this to increase load
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    restart: on-failure

# ── 6. CONSUMER (Python service that reads from Kafka → writes to ClickHouse)
  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: pipeline-consumer
    networks:
      - stream-network
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: user-events
      KAFKA_GROUP_ID: clickhouse-sink-group
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: pipeline_db
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      BATCH_SIZE: 100             # insert N rows at once into ClickHouse
      BATCH_TIMEOUT_SECONDS: 5   # or flush after this many seconds
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: on-failure

# ── 7. FLINK JOBMANAGER (cluster master – schedules & coordinates jobs) ──
  flink-jobmanager:
    build:
      context: ./flink           # uses flink/Dockerfile (has Python + PyFlink)
      dockerfile: Dockerfile
    image: flink-pyflink:1.19    # tag the built image so taskmanager reuses it
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    networks:
      - stream-network
    ports:
      - "8083:8081"   # Flink Web UI (mapped to 8082 to avoid clash with Schema Registry)
    command: jobmanager
    entrypoint: ["/opt/flink/entrypoint-with-permissions.sh"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m
        taskmanager.memory.process.size: 1728m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s
        python.executable: /usr/bin/python3
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: always

# ── 8. FLINK TASKMANAGER (worker – executes the actual computation) ───────
  flink-taskmanager:
    image: flink-pyflink:1.19
    container_name: flink-taskmanager
    hostname: flink-taskmanager
    networks:
      - stream-network
    command: taskmanager
    entrypoint: ["/opt/flink/entrypoint-with-permissions.sh"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1728m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        python.executable: /usr/bin/python3
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    # Scale this horizontally: docker compose up --scale flink-taskmanager=3
    deploy:
      replicas: 1
    restart: always

# ── Submit the Kafka → Flink → ClickHouse enrichment stream ─────────────────
  flink-enrichment-job:
    image: flink-pyflink:1.19
    container_name: flink-enrichment-job
    networks:
      - stream-network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        set -e;
        until curl -fsS http://flink-jobmanager:8081/overview > /dev/null; do sleep 2; done;
        curl -fsS -u "$${CLICKHOUSE_USER}:$${CLICKHOUSE_PASSWORD}"
        --data-binary 'CREATE DATABASE IF NOT EXISTS pipeline_db' http://clickhouse:8123/;
        curl -fsS -u "$${CLICKHOUSE_USER}:$${CLICKHOUSE_PASSWORD}"
        --data-binary "CREATE TABLE IF NOT EXISTS pipeline_db.flink_enriched_events (event_id String, user_id String, event_type LowCardinality(String), page String, product String, amount Float64, country LowCardinality(String), city String, device LowCardinality(String), browser LowCardinality(String), event_time DateTime64(3, 'UTC'), is_purchase UInt8, amount_usd Float64, revenue_tier String, session_hour Int64, platform String) ENGINE = MergeTree() PARTITION BY toYYYYMMDD(event_time) ORDER BY (event_type, user_id, event_time) TTL toDateTime(event_time) + INTERVAL 30 DAY SETTINGS index_granularity = 8192" http://clickhouse:8123/;
        curl -fsS -u "$${CLICKHOUSE_USER}:$${CLICKHOUSE_PASSWORD}"
        --data-binary "CREATE TABLE IF NOT EXISTS pipeline_db.flink_window_counts (window_start DateTime64(3, 'UTC'), window_end DateTime64(3, 'UTC'), event_type LowCardinality(String), device LowCardinality(String), country LowCardinality(String), event_count UInt64, total_amount Float64) ENGINE = ReplacingMergeTree() PARTITION BY toYYYYMMDD(window_start) ORDER BY (window_start, event_type, device, country) TTL toDateTime(window_start) + INTERVAL 60 DAY SETTINGS index_granularity = 8192" http://clickhouse:8123/;
        if curl -fsS http://flink-jobmanager:8081/jobs/overview
        | python3 -c 'import json,sys; sys.exit(0 if any(j["name"] == "insert-into_default_catalog.default_database.clickhouse_sink" and j["state"] == "RUNNING" for j in json.load(sys.stdin)["jobs"]) else 1)';
        then echo "Flink enrichment job is already running"; exit 0; fi;
        exec /opt/flink/bin/flink run --detached --jobmanager flink-jobmanager:8081 --python /opt/flink/jobs/job_enrichment.py
    volumes:
      - ./init-scripts:/opt/clickhouse-init:ro
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.port: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: user-events
      CLICKHOUSE_JDBC_URL: jdbc:clickhouse://clickhouse:8123/pipeline_db
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

# ── 9. FLINK SQL CLIENT (run Flink SQL interactively in your terminal) ────
  flink-sql-client:
    image: flink-pyflink:1.19
    container_name: flink-sql-client
    networks:
      - stream-network
    command: >
      /bin/sh -c "
        echo 'Waiting for JobManager…' &&
        sleep 15 &&
        /opt/flink/bin/sql-client.sh embedded
          -j /opt/flink/lib/extra/flink-sql-connector-kafka-3.2.0-1.19.jar
          -j /opt/flink/lib/extra/flink-connector-jdbc-3.1.2-1.19.jar
      "
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.port: 8081
    volumes:
      - ./flink/lib:/opt/flink/lib/extra
      - ./flink/sql:/opt/flink/sql           # put your .sql job files here
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    profiles:
      - sql-client   # only starts with: docker compose --profile sql-client up
    restart: always

# ── 10. PROMETHEUS (scrapes metrics from Kafka, Flink & ClickHouse) ───────
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   networks:
  #     - stream-network
  #   ports:
  #     - "9090:9090"
